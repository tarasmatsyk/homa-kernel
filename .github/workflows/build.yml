name: Build ARM64 Homa kernel

on:
  push:
    tags: ['v*-homa.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ runner.temp }}/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          source sources.env
          test "$TAG" = "v${LINUX_VERSION}${KERNEL_LOCALVERSION}"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves curl xz-utils zstd kmod python3 ccache
      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-${{ hashFiles('sources.env', 'config/*.config', 'scripts/build.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-${{ hashFiles('sources.env', 'config/*.config', 'scripts/build.sh') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-
      - name: Enable compiler cache
        run: |
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          ccache --zero-stats
      - name: Build kernel and Homa
        run: ./scripts/build.sh
      - name: Show compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats
          fi
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG ARM64" --notes "ARM64 development kernel and Homa module. Check SHA256SUMS before use. Source references are in sources.env."
